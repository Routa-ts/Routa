name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Required by changesets/action to open version PRs and publish releases.
      contents: write
      pull-requests: write
      # Required by npm trusted publishing (OIDC).
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Vite Plus
        uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: 24
          cache: true
          registry-url: https://registry.npmjs.org
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Create release pull request or publish
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: vp run version
          publish-script: vp run release
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"

      # Vercel skips main pushes (apps/docs/vercel.json), so the docs go live only with a release.
      - name: Deploy docs
        if: steps.changesets.outputs.published == 'true'
        env:
          DOCS_DEPLOY_HOOK: ${{ secrets.VERCEL_DOCS_DEPLOY_HOOK }}
        run: |
          if [ -z "$DOCS_DEPLOY_HOOK" ]; then
            echo "::error::Set the VERCEL_DOCS_DEPLOY_HOOK secret to a Vercel deploy hook for main."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --request POST "$DOCS_DEPLOY_HOOK"
