name: Vite Plus job

on:
  workflow_call:
    inputs:
      command:
        description: Command to run after installing dependencies.
        required: true
        type: string
      timeout-minutes:
        description: Job timeout in minutes.
        required: false
        type: number
        default: 15
      fetch-depth:
        description: Commits to fetch; 0 fetches all history so a job can diff against the base branch.
        required: false
        type: number
        default: 1
      capture-report:
        description: Expose this command's job summary for the PR report comment.
        required: false
        type: boolean
        default: false

    outputs:
      report:
        description: JSON-encoded job summary, bounded for a PR comment.
        value: ${{ jobs.run.outputs.report }}

permissions:
  contents: read

jobs:
  run:
    name: Run
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    outputs:
      report: ${{ steps.command.outputs.report }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.fetch-depth }}
          persist-credentials: false

      - name: Setup Vite Plus
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: 24
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Run command
        id: command
        env:
          JOB_COMMAND: ${{ inputs.command }}
          CAPTURE_REPORT: ${{ inputs.capture-report }}
        run: |
          status=0
          sh -eu -c "$JOB_COMMAND" || status=$?
          if [ "$CAPTURE_REPORT" = "true" ]; then
            python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path

          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          summary = summary_path.read_text(encoding="utf-8") if summary_path.exists() else ""
          # Leave room for both reports and links within GitHub's comment limit.
          if len(summary) > 24000:
              summary = summary[:24000]
              if summary.count("```") % 2:
                  summary += "\n```"
              summary += "\n\nReport truncated. See the full Actions summary."
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("report=" + json.dumps(summary, ensure_ascii=False) + "\n")
          PYTHON
          fi
          exit "$status"
