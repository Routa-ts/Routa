name: Vite Plus job

on:
  workflow_call:
    inputs:
      command:
        description: Command to run after installing dependencies.
        required: true
        type: string
      timeout-minutes:
        description: Job timeout in minutes.
        required: false
        type: number
        default: 15

permissions:
  contents: read

jobs:
  run:
    name: Run
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Vite Plus
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: 24
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Run command
        env:
          JOB_COMMAND: ${{ inputs.command }}
        run: sh -eu -c "$JOB_COMMAND"
