name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-checks:
    name: Repo checks
    uses: ./.github/workflows/node-vp-job.yml
    with:
      command: vp run check

  lint:
    name: Lint
    uses: ./.github/workflows/node-vp-job.yml
    with:
      command: vp run lint

  typecheck:
    name: Typecheck
    uses: ./.github/workflows/node-vp-job.yml
    with:
      command: vp run typecheck

  test:
    name: Test
    uses: ./.github/workflows/node-vp-job.yml
    with:
      command: |
        vp run build:packages
        vp exec node scripts/link-local-cli.mjs --root "$GITHUB_WORKSPACE"
        vp run test

  build:
    name: Build
    uses: ./.github/workflows/node-vp-job.yml
    with:
      command: |
        vp run build:packages
        vp exec node scripts/link-local-cli.mjs --root "$GITHUB_WORKSPACE"
        vp run build

  docs:
    name: Docs
    uses: ./.github/workflows/node-vp-job.yml
    with:
      command: vp run --filter @routa-ts/docs build

  design:
    name: Design lab
    uses: ./.github/workflows/node-vp-job.yml
    with:
      command: vp run --filter @routa-ts/design build

  cli-validation:
    name: CLI validation
    uses: ./.github/workflows/node-vp-job.yml
    with:
      command: |
        vp run build:packages
        vp exec node scripts/link-local-cli.mjs --root "$GITHUB_WORKSPACE"
        vp run build
        vp run --filter './examples/*' check
        vp run --filter './examples/*' openapi:check
        vp exec node scripts/check-generated.mjs
        scripts/scaffold-error-smoke.sh

  pack-check:
    name: Pack check
    uses: ./.github/workflows/node-vp-job.yml
    with:
      timeout-minutes: 20
      command: vp run pack:check
